<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumio — Apprendre à coder, créer avec l'IA et lancer son activité</title>
  <meta name="description" content="Lumio est une plateforme de formation gratuite en français : programmation (C, C++, Python, HTML, CSS, JavaScript, cybersécurité, IA), vidéo et contenu par IA, création de business digital. Exercices interactifs dans le navigateur, quiz, progression et certificats.">
  <meta name="theme-color" content="#0f1117">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236d5dfc'/%3E%3Cpath d='M20 16v26h22' fill='none' stroke='%23fff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='44' cy='22' r='5' fill='%23ffd166'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
  <link rel="stylesheet" href="app/style.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('lumio.theme');
        if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
        var f = localStorage.getItem('lumio.font');
        if (f) document.documentElement.dataset.font = f;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip" href="#main">Aller au contenu</a>
  <header class="topbar" id="topbar">
    <a class="brand" href="#/" aria-label="Lumio, accueil">
      <svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="var(--accent)"/><path d="M20 16v26h22" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="44" cy="22" r="5" fill="#ffd166"/></svg>
      <span>Lumio</span>
    </a>
    <nav class="topnav" aria-label="Navigation principale">
      <a href="#/">Parcours</a>
      <a href="#/glossaire">Glossaire</a>
      <a href="#/profil">Mon profil</a>
    </nav>
    <form class="search" role="search" id="searchForm">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="searchInput" placeholder="Rechercher une leçon… ( / )" aria-label="Rechercher" autocomplete="off">
    </form>
    <div class="topactions">
      <button class="iconbtn" id="fontBtn" title="Taille du texte" aria-label="Changer la taille du texte">Aa</button>
      <button class="iconbtn" id="themeBtn" title="Thème clair / sombre" aria-label="Changer de thème">
        <svg class="ico-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
        <svg class="ico-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="iconbtn menubtn" id="menuBtn" aria-label="Menu" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </header>
  <main id="main" class="main" tabindex="-1"></main>
  <footer class="footer">
    <div class="footer-inner">
      <span>Lumio — formation libre, en français, sans inscription.</span>
      <span class="muted">Progression stockée dans ton navigateur · <a href="#/profil">exporter</a> · Raccourcis : <kbd>?</kbd></span>
    </div>
  </footer>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/shell/shell.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/runmode/runmode.min.js"></script>
  <script type="module" src="app/app.js"></script>
</body>
</html>
