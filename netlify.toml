# Site de documentation de Kinetika : statique, aucune commande de build.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/dist/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

# Polices et feuille de base des exemples ouvertes avec CORS : l'aperçu du bac à sable les intègre
# lui-même, mais un exemple téléchargé (ouvert en file://) ou un autre site peut les charger directement.
[[headers]]
  for = "/site/fonts/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/exemples/_base.css"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
