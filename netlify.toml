[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/hero.mp4"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Anciennes pages de la refonte multi-pages : renvoyées vers les sections de la page unique
[[redirects]]
  from = "/services/*"
  to = "/#services"
  status = 301

[[redirects]]
  from = "/tarifs.html"
  to = "/#tarifs"
  status = 301

[[redirects]]
  from = "/realisations.html"
  to = "/#avis"
  status = 301

[[redirects]]
  from = "/a-propos.html"
  to = "/#agence"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/#contact"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
