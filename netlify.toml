# Site statique (dossier public/) + deux fonctions Netlify pour l'accès payant.
# Aucune commande de build : le contenu payant reste dans prive/, hors du dossier publié,
# et n'est embarqué que dans les fonctions (included_files).

[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["prive/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://player.vimeo.com https://iframe.mediadelivery.net; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'"

[[headers]]
  for = "/cours/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/merci/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "public, max-age=300"
