<!doctype html>

<head>

  <style>
    :root { --bg: #0f1117; --bg-2: #161a24; --line: #2a3040; --text: #e8eaf1; --text-2: #a7adbf; --accent: #6d5dfc; color-scheme: dark; }
    @media (prefers-color-scheme: light) { :root { --bg: #f6f7fb; --bg-2: #fff; --line: #dfe3ec; --text: #171a24; --text-2: #4b5268; color-scheme: light; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text); font: 16px/1.6 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 520px; text-align: center; background: var(--bg-2); border: 1px solid var(--line); border-radius: 18px; padding: 40px 28px; }
    .code { font: 700 64px/1 "JetBrains Mono", ui-monospace, monospace; letter-spacing: -2px; margin: 0; }
    .code span { color: var(--accent); }
    h1 { font-size: 1.4rem; margin: 14px 0 8px; }
    p { color: var(--text-2); margin: 0 0 22px; }
    a { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; padding: 11px 18px; border-radius: 10px; font-weight: 600; }
    a:focus-visible { outline: 3px solid #ffd166; outline-offset: 3px; }
  </style>
</head>
