<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu animé — Exemples Kinetika</title>
<meta name="description" content="Un menu plein écran : une timeline jouée à l’ouverture, à rebours à la fermeture.">
<link rel="icon" href="../site/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="_base.css">
<script type="importmap">{ "imports": { "kinetika": "../dist/kinetika.esm.js" } }</script>
<style data-ex>
.page { width: min(980px, 92vw); display: grid; gap: 16px; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; position: relative; z-index: 3; }
.logo { font-family: var(--display); font-weight: 900; font-size: 22px; text-transform: uppercase; letter-spacing: -.01em; }
.toggle { position: relative; z-index: 3; display: inline-flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 8px 0 20px; border-radius: 99px; border: 1px solid var(--line-2);
  background: var(--ink-3); color: var(--paper); font-weight: 600; cursor: pointer; }
.toggle .ico { position: relative; width: 32px; height: 32px; border-radius: 50%; background: var(--flare); }
.toggle .ico i { position: absolute; left: 9px; right: 9px; height: 2px; background: var(--ink); border-radius: 2px; }
.toggle .ico i:first-child { top: 12px; } .toggle .ico i:last-child { top: 18px; }
.hero { padding: 6vh 0; }
.hero h2 { margin: 0 0 12px; font-family: var(--display); font-weight: 900; font-size: clamp(40px, 8vw, 96px); line-height: .9; text-transform: uppercase; letter-spacing: -.02em; font-stretch: 112%; }
.hero p { margin: 0; color: var(--paper-2); max-width: 46ch; }
.overlay { position: fixed; inset: 0; z-index: 2; background: var(--flare); color: var(--ink); display: grid; align-content: center; padding: 0 8vw;
  clip-path: circle(0% at 100% 0%); visibility: hidden; }
.overlay.is-open { visibility: visible; }
.overlay ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.overlay li { overflow: clip; padding-block: .06em; }
.overlay a { display: inline-block; font-family: var(--display); font-weight: 900; text-transform: uppercase; text-decoration: none; letter-spacing: -.02em; line-height: .95;
  font-size: clamp(42px, 9vw, 110px); font-stretch: 118%; color: var(--ink); }
.overlay a:hover, .overlay a:focus-visible { color: var(--paper); outline-color: var(--ink); }
.overlay .meta { display: flex; flex-wrap: wrap; gap: 8px 28px; margin-top: 4vh; font-family: var(--mono); font-size: 13px; }
</style>
</head>
<body>
<h1 class="kt-sr">Menu animé</h1>
<!--ex-->
<div class="page">
  <div class="bar">
    <span class="logo">Studio</span>
    <button class="toggle" type="button" aria-expanded="false" aria-controls="menu"><span class="txt">Menu</span><span class="ico" aria-hidden="true"><i></i><i></i></span></button>
  </div>
  <div class="hero">
    <h2>Un menu, une timeline</h2>
    <p>Ouvrir joue la timeline, fermer la rejoue à rebours, même au milieu de l’animation. Échap ferme le menu.</p>
  </div>
</div>
<nav class="overlay" id="menu" aria-label="Menu de démonstration" inert>
  <ul>
    <li><a href="#">Projets</a></li>
    <li><a href="#">Studio</a></li>
    <li><a href="#">Journal</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
  <div class="meta"><span>hello@studio.test</span><span>Toulouse · Lisbonne</span></div>
</nav>
<!--/ex-->
<script type="module" data-ex>
import { timeline, stagger } from 'kinetika';

const btn = document.querySelector('.toggle');
const overlay = document.querySelector('.overlay');
const label = btn.querySelector('.txt');
const [l1, l2] = btn.querySelectorAll('.ico i');
let open = false;
let started = false;

const tl = timeline({
  autoplay: false,
  defaults: { ease: 'outExpo' },
  // fin dans un sens comme dans l'autre : on masque le menu s'il est fermé
  onComplete: () => { if (!open) overlay.classList.remove('is-open'); },
})
  .add(overlay, { clipPath: ['circle(0% at 100% 0%)', 'circle(150% at 100% 0%)'], duration: 900, ease: 'inOutQuart' })
  .add(l1, { y: [0, 3], rotate: [0, 45], duration: 500 }, 0)
  .add(l2, { y: [0, -3], rotate: [0, -45], duration: 500 }, 0)
  .add('.overlay a', { y: ['110%', '0%'], rotate: [6, 0], duration: 900, delay: stagger(70) }, '-=450')
  .add('.overlay .meta span', { opacity: [0, 1], y: [12, 0], duration: 600, delay: stagger(80) }, '-=600');

function setOpen(next, fromUser = true) {
  if (next === open) return;
  open = next;
  btn.setAttribute('aria-expanded', String(open));
  label.textContent = open ? 'Fermer' : 'Menu';
  overlay.inert = !open;
  if (open) overlay.classList.add('is-open');
  // première ouverture : lecture ; ensuite chaque bascule inverse le sens, où qu'en soit la tête
  if (!started) { started = true; tl.play(); } else tl.reverse();
  if (open && fromUser) overlay.querySelector('a').focus({ preventScroll: true });
}

btn.addEventListener('click', () => setOpen(!open));
overlay.addEventListener('click', (e) => { if (e.target.closest('a')) { e.preventDefault(); setOpen(false); btn.focus(); } });
addEventListener('keydown', (e) => { if (e.key === 'Escape' && open) { setOpen(false); btn.focus(); } });

// dans une vignette de la galerie : ouverture et fermeture automatiques
if (location.search.includes('vignette')) setInterval(() => setOpen(!open, false), 2600);
</script>
</body>
</html>
