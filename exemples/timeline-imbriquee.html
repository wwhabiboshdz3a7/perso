<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timelines imbriquées — Exemples Kinetika</title>
<meta name="description" content="Des sous-timelines réutilisables, assemblées dans une timeline principale qui boucle.">
<link rel="icon" href="../site/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="_base.css">
<script type="importmap">{ "imports": { "kinetika": "../dist/kinetika.esm.js" } }</script>
<style data-ex>
.cards { display: flex; gap: 22px; perspective: 1000px; flex-wrap: wrap; justify-content: center; padding: 20px; }
.card { position: relative; width: 170px; height: 230px; transform-style: preserve-3d; }
.face { position: absolute; inset: 0; border-radius: 18px; display: grid; place-items: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.front { background: var(--ink-3); border: 1px solid var(--line-2); font-family: var(--display); font-size: 70px; font-weight: 900; color: var(--line-2); }
.back { transform: rotateY(180deg); background: var(--paper); color: var(--ink); font-family: var(--display); font-weight: 900; font-size: 52px; text-transform: uppercase; }
.badge { position: absolute; top: -12px; right: -12px; width: 40px; height: 40px; border-radius: 50%; background: var(--flare); display: grid; place-items: center; font-family: var(--mono); font-size: 14px; color: var(--ink); }
@media (max-width: 600px) { .card { width: 96px; height: 140px; } .front { font-size: 40px; } .back { font-size: 30px; } .cards { gap: 12px; } }
</style>
</head>
<body>
<h1 class="kt-sr">Timelines imbriquées</h1>
<!--ex-->
<div class="cards">
  <div class="card"><div class="face front">?</div><div class="face back">Ki<span class="badge">1</span></div></div>
  <div class="card"><div class="face front">?</div><div class="face back">ne<span class="badge">2</span></div></div>
  <div class="card"><div class="face front">?</div><div class="face back">tik<span class="badge">3</span></div></div>
  <div class="card"><div class="face front">?</div><div class="face back">a<span class="badge">4</span></div></div>
</div>
<!--/ex-->
<script type="module" data-ex>
import { timeline } from 'kinetika';

// Une petite timeline réutilisable par carte…
const flip = (card) => timeline()
  .add(card, { rotateY: [0, 180], y: [0, -16, 0], duration: 900, ease: 'inOutBack(1.3)' })
  .add(card.querySelector('.badge'), { scale: [0, 1], duration: 600, ease: 'outBack(2.2)' }, '-=250');

// …assemblées dans une timeline principale qui boucle en aller-retour.
const main = timeline({ loop: true, alternate: true, loopDelay: 900 });
document.querySelectorAll('.card').forEach((card, i) => {
  main.add(flip(card), i === 0 ? 0 : '-=700');
});
</script>
</body>
</html>
