<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valeurs relatives — Exemples Kinetika</title>
<meta name="description" content="Des boutons qui ajoutent, retirent ou multiplient : « +=80 », « -=80 », « *=1.5 ».">
<link rel="icon" href="../site/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="_base.css">
<script type="importmap">{ "imports": { "kinetika": "../dist/kinetika.esm.js" } }</script>
<style data-ex>
.wrap { width: min(640px, 92vw); display: grid; gap: 28px; }
.track { position: relative; height: 120px; border-radius: 16px; border: 1px solid var(--line); background: repeating-linear-gradient(90deg, transparent 0 39px, var(--line) 39px 40px); display: grid; place-items: center; overflow: hidden; }
.box { width: 72px; height: 72px; border-radius: 16px; background: var(--flare); display: grid; place-items: center; color: var(--ink); font-family: var(--display); font-weight: 900; font-size: 30px; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.out { margin: 0; font-family: var(--mono); font-size: 13px; color: var(--paper-2); text-align: center; min-height: 1.5em; }
</style>
</head>
<body>
<h1 class="kt-sr">Valeurs relatives</h1>
<!--ex-->
<div class="wrap">
  <div class="track"><div class="box">K</div></div>
  <div class="btns">
    <button class="btn" type="button" data-p="x" data-v="-=80">x : '-=80'</button>
    <button class="btn" type="button" data-p="x" data-v="+=80">x : '+=80'</button>
    <button class="btn" type="button" data-p="rotate" data-v="+=90">rotate : '+=90'</button>
    <button class="btn" type="button" data-p="scale" data-v="*=1.25">scale : '*=1.25'</button>
    <button class="btn" type="button" data-p="scale" data-v="*=0.8">scale : '*=0.8'</button>
    <button class="btn btn--hot" type="button" data-reset>Remettre à zéro</button>
  </div>
  <p class="out" aria-live="polite"></p>
</div>
<!--/ex-->
<script type="module" data-ex>
import { animate, utils } from 'kinetika';

const box = document.querySelector('.box');
const out = document.querySelector('.out');
const show = () => {
  out.textContent = ['x', 'rotate', 'scale'].map((p) => `${p} = ${utils.get(box, p)}`).join('   ');
};

document.querySelector('.btns').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.hasAttribute('data-reset')) {
    animate(box, { x: 0, rotate: 0, scale: 1, duration: 900, ease: 'outElastic(1, .5)', onUpdate: show });
    return;
  }
  // relatif à la valeur actuelle, même au milieu d'une autre animation
  animate(box, { [b.dataset.p]: b.dataset.v, duration: 700, ease: 'outBack(1.6)', onUpdate: show });
});
show();
</script>
</body>
</html>
