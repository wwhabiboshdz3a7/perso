<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion path — Exemples Kinetika</title>
<meta name="description" content="Un avion en papier suit une courbe en s’orientant, sa traînée se dessine derrière lui.">
<link rel="icon" href="../site/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="_base.css">
<script type="importmap">{ "imports": { "kinetika": "../dist/kinetika.esm.js" } }</script>
<style data-ex>
.sky { width: min(1200px, 96vw); display: grid; gap: 14px; justify-items: center; }
svg { width: 100%; height: auto; overflow: visible; }
.route { fill: none; stroke: var(--line-2); stroke-width: 2; stroke-dasharray: 2 12; stroke-linecap: round; }
.trail { fill: none; stroke: var(--flare); stroke-width: 4; stroke-linecap: round; }
.plane path { stroke-linejoin: round; }
.plane .wing { fill: var(--paper); }
.plane .fold { fill: #c9c2b5; }
.cloud { fill: var(--ink-3); }
.pin { fill: var(--ink); stroke: var(--volt); stroke-width: 3; transform-box: fill-box; transform-origin: center; }
.cap { margin: 0; text-align: center; }
</style>
</head>
<body>
<h1 class="kt-sr">Motion path</h1>
<!--ex-->
<div class="sky">
  <svg viewBox="0 0 1000 560" role="img" aria-label="Un avion en papier suit une trajectoire en boucle">
    <g class="clouds">
      <ellipse class="cloud" cx="180" cy="120" rx="90" ry="26"/>
      <ellipse class="cloud" cx="790" cy="470" rx="120" ry="30"/>
      <ellipse class="cloud" cx="640" cy="70" rx="60" ry="18"/>
    </g>
    <path id="route" class="route" d="M40 470 C 200 470, 260 150, 430 160 C 600 170, 580 420, 430 400 C 300 382, 350 150, 560 130 C 760 110, 800 360, 960 290"/>
    <path class="trail" d="M40 470 C 200 470, 260 150, 430 160 C 600 170, 580 420, 430 400 C 300 382, 350 150, 560 130 C 760 110, 800 360, 960 290"/>
    <circle class="pin" cx="40" cy="470" r="9"/>
    <circle class="pin" cx="960" cy="290" r="9"/>
    <g class="plane">
      <path class="wing" d="M30 0 L-20 -18 L-9 0 Z"/>
      <path class="fold" d="M30 0 L-9 0 L-20 16 Z"/>
    </g>
  </svg>
  <p class="cap label">motionPath('#route') → x, y, rotate · drawable('.trail')</p>
</div>
<!--/ex-->
<script type="module" data-ex>
import { timeline, animate, motionPath, drawable, engine } from 'kinetika';

const trail = drawable('.trail');
const FLIGHT = 4600;

// les nuages dérivent doucement, chacun à son rythme
animate('.cloud', { x: (el, i) => [0, i % 2 ? -50 : 60], duration: (el, i) => 7000 + i * 1800, ease: 'inOutSine', loop: true, alternate: true });

const tl = timeline({ loop: true, loopDelay: 300 })
  .add('.pin', { scale: [0, 1], duration: 600, ease: 'outBack(3)' })
  .add('.plane', { opacity: [0, 1], duration: 300 }, '-=200')
  // x, y et angle calculés le long du chemin à chaque image
  .add('.plane', { ...motionPath('#route'), duration: FLIGHT, ease: 'inOutSine' }, '<<')
  .add(trail, { draw: [0, 1], duration: FLIGHT, ease: 'inOutSine' }, '<<');

if (!engine.prefersReducedMotion) {
  tl.add(trail, { drawStart: [0, 1], duration: 1100, ease: 'inOutQuad' }, '+=300')
    .add('.plane', { opacity: 0, scale: 0.4, duration: 500, ease: 'inQuad' }, '<<')
    .add('.pin', { scale: 0, duration: 400, ease: 'inBack(2)' }, '-=300');
}
</script>
</body>
</html>
