<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracé SVG — Exemples Kinetika</title>
<meta name="description" content="Un mot écrit au trait : chaque contour se dessine, puis s’efface par le début.">
<link rel="icon" href="../site/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="_base.css">
<script type="importmap">{ "imports": { "kinetika": "../dist/kinetika.esm.js" } }</script>
<style data-ex>
.wrap { width: min(1100px, 92vw); display: grid; gap: 22px; justify-items: center; }
svg { width: 100%; height: auto; overflow: visible; }
.ghost path { fill: none; stroke: var(--ink-4); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
.ink path { fill: none; stroke: var(--paper); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
.ink path.hot { stroke: var(--flare); }
.swoosh { fill: none; stroke: var(--volt); stroke-width: 5; stroke-linecap: round; }
.dot { fill: var(--flare); transform-box: fill-box; transform-origin: center; }
.cap { margin: 0; }
</style>
</head>
<body>
<h1 class="kt-sr">Tracé SVG</h1>
<!--ex-->
<div class="wrap">
  <svg viewBox="-24 -24 640 200" role="img" aria-label="Le mot Kinetika écrit au trait">
    <g class="ghost"></g>
    <g class="ink"></g>
    <path class="swoosh" d="M-6 142 C 120 118, 300 160, 420 136 S 570 112, 600 128"/>
    <circle class="dot" cx="600" cy="128" r="9"/>
  </svg>
  <p class="cap label">drawable(chemins) · draw: [0, 1] · drawStart: [0, 1]</p>
</div>
<!--/ex-->
<script type="module" data-ex>
import { timeline, drawable, stagger, engine } from 'kinetika';

// Lettrage monoligne : chaque tracé est un chemin indépendant, dans une boîte de 60 × 100.
const LETTERS = {
  K: { w: 56, d: ['M0 0V100', 'M52 0L4 56', 'M20 40L56 100'] },
  I: { w: 0, d: ['M0 0V100'] },
  N: { w: 52, d: ['M0 100V0L52 100V0'] },
  E: { w: 48, d: ['M48 0H0V100H48', 'M0 50H38'] },
  T: { w: 60, d: ['M0 0H60', 'M30 0V100'] },
  A: { w: 60, d: ['M0 100L30 0L60 100', 'M13 62H47'] },
};
const ns = 'http://www.w3.org/2000/svg';
const ghost = document.querySelector('.ghost');
const ink = document.querySelector('.ink');
let x = 0;
[...'KINETIKA'].forEach((ch, li) => {
  const L = LETTERS[ch];
  for (const d of L.d) {
    for (const layer of [ghost, ink]) {
      const p = document.createElementNS(ns, 'path');
      p.setAttribute('d', d);
      p.setAttribute('transform', `translate(${x} 0)`);
      if (layer === ink && (li === 1 || li === 4)) p.classList.add('hot');
      layer.appendChild(p);
    }
  }
  x += L.w + 30;
});

const strokes = drawable('.ink path');
const swoosh = drawable('.swoosh');

const tl = timeline({ loop: true, loopDelay: 400 })
  .add(strokes, { draw: [0, 1], duration: 650, delay: stagger(85), ease: 'inOutQuad' })
  .add(swoosh, { draw: [0, 1], duration: 1100, ease: 'outExpo' }, '-=350')
  .add('.dot', { scale: [0, 1], duration: 800, ease: 'outElastic(1, .4)' }, '-=500');

// effacement par le début du tracé (pas en mouvement réduit : le mot reste écrit)
if (!engine.prefersReducedMotion) {
  tl.add([...strokes, ...swoosh], { drawStart: [0, 1], duration: 600, delay: stagger(50), ease: 'inQuad' }, '+=1300')
    .add('.dot', { scale: 0, duration: 300, ease: 'inBack(2)' }, '-=300');
}
</script>
</body>
</html>
