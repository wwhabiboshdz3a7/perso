name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests et build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, lts/*]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Tests unitaires
        run: npm test
      - name: Types TypeScript
        run: npm run types
      - name: Build
        run: npm run build
      - name: dist/ est à jour
        run: git diff --exit-code -- dist/ ':!dist/sizes.json'
