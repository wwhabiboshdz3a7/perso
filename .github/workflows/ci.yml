name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests et build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Versions LTS maintenues. jsdom (tests) exige Node 22.22.2+, 24.15+ ou 26+.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Tests unitaires
        run: npm test
      - name: Types TypeScript
        run: npm run types
      - name: Build
        run: npm run build
      - name: dist/ est à jour
        run: git diff --exit-code -- dist/ ':!dist/sizes.json'
